}

  --accent:#3CC4BB; --accent-ink:#06201E; --warn:#F0B35E; --warn-bg:#3A2B12; --ok:#5CC981; --ok-bg:#12301F;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:14px 0 12px}
.brand{font:700 24px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand i svg{width:17px;height:17px}
.langs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.langs button{background:var(--surface);border:0;border-right:1px solid var(--line);color:var(--muted);font:600 13px var(--body);padding:0 12px;min-height:36px;cursor:pointer}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;width:100%;padding-bottom:2px}
nav.tabs button{background:none;border:0;color:var(--muted);font:500 15px var(--body);padding:0 16px;min-height:44px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.15} h2{font-size:19px} h3{font-size:15px;font-family:var(--body);font-weight:600;letter-spacing:0}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.banner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.banner.todo{background:var(--warn-bg);color:var(--warn)}
.banner b{font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.bar .grow{flex:1 1 220px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:500;font-size:15px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)} .btn.sm{padding:0 12px;min-height:38px;font-size:14px} .btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.in,select.in,textarea.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;min-height:44px;font-size:16px}
textarea.in{resize:vertical;min-height:84px}
label.l{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
label.l .in{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sec>h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>h2 small{font:400 13px var(--body);color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.plate{font:500 15px var(--mono);border:1.5px solid var(--ink);border-radius:5px;padding:2px 9px;letter-spacing:.06em;white-space:nowrap}
.rec .meta{min-width:0} .rec .meta b{font-weight:600} .rec .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.rec .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--field);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.ex{border-style:dashed}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:10px 10px;cursor:pointer;font-size:15px;background:var(--field);border-right:1px solid var(--line);position:relative}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.chk{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .seg label{padding:8px 12px;font-size:14px}
.car{width:100%;max-width:260px;margin:0 auto;display:block;cursor:crosshair;touch-action:manipulation;color:var(--ink)}
.car .body{fill:var(--field);stroke:var(--ink);stroke-width:2}
.car .glass{fill:var(--line);stroke:var(--ink);stroke-width:1.5}
.car .wheel{fill:var(--ink)}
.car .pin circle{fill:var(--pin);stroke:var(--surface);stroke-width:2}
.car .pin text{fill:#fff;font:700 15px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dmg{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.dmg b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pin);color:#fff;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumbs div{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:16px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.pad{background:var(--pad);border:1.5px dashed var(--muted);border-radius:10px;width:100%;height:150px;touch-action:none;display:block;cursor:crosshair}
.fuel{display:flex;align-items:center;gap:12px} .fuel input{flex:1;accent-color:var(--accent);min-height:44px} .fuel output{font:500 14px var(--mono);min-width:44px;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi b{display:block;font:700 26px/1.2 var(--display);font-variant-numeric:tabular-nums}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.method{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--field)}
.method h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.method .in{background:var(--surface)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.pre{white-space:pre-wrap;font:400 13px/1.55 var(--mono);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags .chip{display:inline-flex;align-items:center;font-size:13px}
.tags .chip button{background:none;border:0;cursor:pointer;color:inherit;font-size:18px;line-height:1;padding:4px 2px 4px 8px}
.hint{font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.split{grid-template-columns:1fr}.rec{grid-template-columns:1fr}.rec .acts{justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>

let lang="es";
function t(k,v){const e=T[k];let s=e?(e[lang]||e.es):k;if(v!==undefined)s=s.replace(/\{[a-z]+\}/,v);return s}
function lbl(x){return typeof x==="string"&&x.indexOf("k:")===0?t(x.slice(2)):x}
const LOC={es:"es-ES",en:"en-GB",de:"de-DE"};
const eur=n=>new Intl.NumberFormat(LOC[lang],{style:"currency",currency:"EUR"}).format(Number(n)||0);
const fdate=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleString(LOC[lang],{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})};
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const STATUSCLS={pendiente:"warn",pagado:"ok",vencido:"bad"};

let downloads=null;
function fileShim(){return {save:async function(o){
 const filename=o.filename,data=o.data;const ext=filename.split(".").pop().toLowerCase();
 const mime={pdf:"application/pdf",json:"application/json",csv:"text/csv"}[ext]||"application/octet-stream";
 const blob=new Blob([data],{type:mime});
 try{const f=new File([blob],filename,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return {status:"saved"}}}
 catch(e){if(e&&e.name==="AbortError")throw {code:"declined"}}
 const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(u)},60000);return {status:"saved"}}}}
(async()=>{try{downloads=window.claude?await window.claude.use("downloads"):null}catch(e){downloads=null}if(!downloads)downloads=fileShim();render()})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

let db;
function load(){try{const s=localStorage.getItem(KEY);if(s){db=JSON.parse(s)}}catch(e){}
  if(!db||!db.settings||!Array.isArray(db.records))db=defaults();
  const s=db.settings;if(!s.co)s.co=emptyCo();if(!s.lang)s.lang="";if(s.payNote==null)s.payNote="k:pay_note_d";
  if(s.payNote==="Indica la referencia del acta en el concepto.")s.payNote="k:pay_note_d";
  if(s.company&&!s.co.name){s.co.name=s.company}
  if(!Array.isArray(s.team))s.team=["k:team_def"];if(!Array.isArray(s.fields))s.fields=[];if(!Array.isArray(s.checklist))s.checklist=[];
  const nav=(navigator.language||"es").slice(0,2).toLowerCase();lang=["es","en","de"].includes(s.lang)?s.lang:(["es","en","de"].includes(nav)?nav:"es")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast(t("full"));return false}}
load();

let view="actas", cur=null, q="", ftype="all", confirmId=null, tmr;
function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>e.hidden=true,3200)}
function copy(text){
  const done=()=>toast(t("copied"));
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast(t("copy_fail"))}ta.remove()};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}
function payRef(r){return "TR-"+String(r.plate||"").replace(/\s+/g,"").toUpperCase()+"-"+String(r.date||"").slice(2,10).replace(/-/g,"")}
function payText(r){
  const s=db.settings,m=r.pay.method,ref=r.pay.ref||payRef(r),amt=eur(r.pay.amount),f=t("fill"),note=lbl(s.payNote||"");
  let L;
  if(m==="transferencia")L=[t("i_amt",amt),t("i_holder",s.holder||f),t("i_iban",s.iban||f)].concat(s.bic?[t("i_bic",s.bic)]:[],[t("i_concept",ref),note]);
  else if(m==="bizum")L=[t("i_amt",amt),t("i_bizum",s.bizum||f),t("i_concept",ref),note];
  else if(m==="enlace")L=[t("i_amt",amt),t("i_link",s.payLink||f),t("i_ref",ref),note];
  else if(m==="efectivo")L=[t("i_cash",amt),t("i_ref",ref)];
  else L=[t("i_amt",amt),t("i_ref",ref)];
  return L.filter(Boolean).join("\n");
}
function isOverdue(r){return r.pay.status==="pendiente"&&r.pay.amount>0&&(Date.now()-new Date(r.date))>14*864e5}
function pstatus(r){return isOverdue(r)?"vencido":r.pay.status}
function chip(k){return `<span class="chip ${STATUSCLS[k]||"warn"}">${t("st_"+k)}</span>`}
function coFilled(){const c=db.settings.co;return !!(c.name&&c.street&&c.city)}

/* ---------- navegación e idioma ---------- */
function go(v){
  if(view==="editor"&&v!=="editor"&&cur&&$("#ef")){}
  if(v==="editor"&&!cur)cur=blank();
  view=v;if(location.hash!=="#"+v)location.hash=v;render();window.scrollTo(0,0)
}
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["actas","editor","pagos","ajustes"].includes(v)&&v!==view){if(v==="editor"&&!cur)cur=blank();view=v;render()}});
function setLang(l){
  if(view==="editor"&&cur&&$("#ef")){try{readForm()}catch(e){}}
  lang=l;db.settings.lang=l;save();render();
}
function blank(){return {id:uid(),type:"entrega",date:nowLocal(),plate:"",model:"",vin:"",color:"",km:"",fuel:50,client:{name:"",doc:"",phone:"",email:""},checks:{},extra:{},damages:[],photos:[],notes:"",sigClient:"",sigStaff:"",staff:db.settings.team[0]||"",pay:{amount:0,method:"efectivo",status:"pendiente",ref:"",paidAt:""},isNew:true}}

function render(){
  document.documentElement.lang=lang;
  $("#langs").innerHTML=["es","en","de"].map(l=>`<button data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("");
  $("#tabs").innerHTML=["actas","editor","pagos","ajustes"].map(v=>`<button data-go="${v}"${v===view?' aria-current="page"':""}>${t("nav_"+v)}</button>`).join("");
  const app=$("#app");
  if(view==="actas")app.innerHTML=vList();
  else if(view==="editor")app.innerHTML=vEditor(),bindEditor();
  else if(view==="pagos")app.innerHTML=vPagos();
  else app.innerHTML=vAjustes();
  bindView();
}

/* ---------- lista ---------- */
function vList(){
  const list=db.records.filter(r=>(ftype==="all"||r.type===ftype)&&(!q||(r.plate+" "+r.model+" "+r.client.name+" "+r.vin).toLowerCase().includes(q.toLowerCase())));
  return `<div class="banner"><b>${t("ban_b")}</b><span>${t("ban_t")}</span></div>
  ${coFilled()?"":`<div class="banner todo"><span>${t("co_todo")}</span><button class="btn sm" data-go2="ajustes">${t("co_go")}</button></div>`}
  <h1 style="margin-top:12px">${t("list_h")}</h1>
  <div class="bar"><input class="in grow" id="q" type="search" placeholder="${esc(t("search"))}" value="${esc(q)}" aria-label="${esc(t("search"))}">
    <select class="in" id="ft" style="width:auto" aria-label="Filter"><option value="all">${t("f_all")}</option><option value="entrega"${ftype==="entrega"?" selected":""}>${t("f_ent")}</option><option value="devolucion"${ftype==="devolucion"?" selected":""}>${t("f_dev")}</option></select>
    <button class="btn primary" data-act="new">${t("new_btn")}</button></div>
  <div class="rows">${list.length?list.map(recRow).join(""):`<div class="empty">${t("empty_list")}</div>`}</div>`;
}
function recRow(r){
  return `<div class="rec"><span class="plate">${esc(r.plate||t("noplate"))}</span>
   <div class="meta"><b>${esc(r.model||t("nomodel"))}</b> <span class="chip">${r.type==="entrega"?t("t_ent"):t("t_dev")}</span> ${r.example?`<span class="chip ex">${t("ex")}</span>`:""} ${r.pay.amount>0?chip(pstatus(r)):""}
   <div class="sub">${esc(r.client.name||t("nocli"))} · ${fdate(r.date)} · ${r.km!==""?Number(r.km).toLocaleString(LOC[lang])+" km":t("kmunk")} · ${t("n_dmg",r.damages.length)} · ${t("n_ph",r.photos.length)}</div></div>
   <div class="acts"><button class="btn sm" data-act="edit" data-id="${r.id}">${t("b_open")}</button><button class="btn sm" data-act="pdf" data-id="${r.id}"${downloads?"":` disabled title="${esc(t("no_dl"))}"`}>PDF</button><button class="btn sm" data-act="dup" data-id="${r.id}">${t("b_dup")}</button><button class="btn sm danger" data-act="del" data-id="${r.id}">${confirmId===r.id?t("b_sure"):t("b_del")}</button></div></div>`;

function pad(id,init){

  let down=false,dirty=!!init;
  const pt=e=>{const b=c.getBoundingClientRect();return [(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
  c.addEventListener("pointerdown",e=>{down=true;try{c.setPointerCapture(e.pointerId)}catch(x2){}const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();dirty=true;e.preventDefault()});
  c.addEventListener("pointermove",e=>{if(!down)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();e.preventDefault()});

}

  $$("[data-co]").forEach(i=>i.addEventListener("input",()=>{db.settings.co[i.dataset.co]=i.value;save()}));
  const bi=$("#b-imp");if(bi)bi.addEventListener("click",()=>$("#imp").click());
  const imp=$("#imp");if(imp)imp.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.settings||!Array.isArray(j.records))throw 0;db=j;save();load();toast(t("bk_restored"));render()}catch(x){toast(t("bk_bad"))}e.target.value=""});
}
document.addEventListener("click",async e=>{
  const lb=e.target.closest("[data-lang]");if(lb){setLang(lb.dataset.lang);return}
  const gb=e.target.closest("[data-go]");if(gb){cur=gb.dataset.go==="editor"?blank():cur;if(gb.dataset.go!=="editor"&&view==="editor")cur=null;go(gb.dataset.go);return}
  const g2=e.target.closest("[data-go2]");if(g2){go(g2.dataset.go2);return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,r=id&&db.records.find(x=>x.id===id),s=db.settings,i=+b.dataset.i;
  if(a==="new"){cur=blank();go("editor")}
  else if(a==="edit"){cur=JSON.parse(JSON.stringify(r));go("editor")}
  else if(a==="dup"){const c=JSON.parse(JSON.stringify(r));c.id=uid();delete c.example;c.date=nowLocal();c.pay.status="pendiente";c.pay.paidAt="";c.sigClient="";c.sigStaff="";db.records.unshift(c);save();toast(t("duped"));render()}
  else if(a==="del"){if(confirmId===id){db.records=db.records.filter(x=>x.id!==id);confirmId=null;save();render()}else{confirmId=id;render();setTimeout(()=>{if(confirmId===id){confirmId=null;if(view==="actas")render()}},3000)}}
  else if(a==="pdf")exportPdf(r);
  else if(a==="togglepay"){r.pay.status=r.pay.status==="pagado"?"pendiente":"pagado";r.pay.paidAt=r.pay.status==="pagado"?nowLocal():"";save();render()}
  else if(a==="paytext")copy(payText(r));
  else if(a==="addteam"){const v=$("#newteam").value.trim();if(v){s.team.push(v);save();render()}}
  else if(a==="rmteam"){s.team.splice(i,1);save();render()}
  else if(a==="addcheck"){const v=$("#newcheck").value.trim();if(v&&!s.checklist.includes(v)){s.checklist.push(v);save();render()}}
  else if(a==="rmcheck"){s.checklist.splice(i,1);save();render()}
  else if(a==="addfield"){const v=$("#newfield").value.trim();if(v&&!s.fields.includes(v)){s.fields.push(v);save();render()}}
  else if(a==="rmfield"){s.fields.splice(i,1);save();render()}
  else if(a==="export"){try{await downloads.save({filename:"traspaso-"+nowLocal().slice(0,10)+".json",data:JSON.stringify(db)});toast(t("bk_ok"))}catch(x){if(!x||x.code!=="declined")toast(t("dl_err"))}}
  else if(a==="csv"){const rows=[["Date","Type","Plate","Model","Km","Customer","Amount","Method","Status"]].concat(db.records.map(r=>[r.date,r.type,r.plate,r.model,r.km,r.client.name,r.pay.amount,r.pay.method,r.pay.status]));
    try{await downloads.save({filename:"traspaso.csv",data:"﻿"+rows.map(l=>l.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\n")});toast(t("csv_ok"))}catch(x){if(!x||x.code!=="declined")toast(t("dl_err"))}}
  else if(a==="rmex"){if(confirmId==="rmex"){db.records=db.records.filter(r=>!r.example);confirmId=null;save();render()}else{confirmId="rmex";render();setTimeout(()=>{confirmId=null;if(view==="ajustes")render()},3000)}}
});
const h=location.hash.slice(1);if(["pagos","ajustes"].includes(h))view=h;else if(h==="editor"){cur=blank();view="editor"}
render();
})();
</script>

</body></html>
